
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vores Boligagent</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    max-width: 700px;
    margin: auto;
    padding: 20px;
  }
  h1 { color: #173b62; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 190px;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
  }
  button {
    background: #1769aa;
    color: white;
    border: none;
    padding: 13px 18px;
    border-radius: 9px;
    margin-top: 12px;
    cursor: pointer;
  }
  #resultat {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-top: 20px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>🏠 Vores Boligagent</h1>
<p>Indsæt et Facebook-opslag her:</p>

<textarea id="opslag"
  placeholder="Indsæt boligopslaget her..."></textarea>

<button onclick="tjekOpslag()">🔎 Tjek bolig</button>

<div id="resultat">Resultatet vises her.</div>

<button id="kopierKnap" onclick="kopierKommentar()" hidden>
  📋 Kopiér kommentar
</button>

<button id="gemKnap" onclick="gemBolig()" hidden>
  💾 Gem bolig
</button>

<h2>❤️ Gemte boliger</h2>
<div id="gemteBoliger"></div>


<script>

let senesteOpslag = "";

function gemBolig() {
  if (!senesteOpslag) return;

  const gemte = JSON.parse(
    localStorage.getItem("gemteBoliger") || "[]"
  );

  if (!gemte.includes(senesteOpslag)) {
    gemte.push(senesteOpslag);
    localStorage.setItem("gemteBoliger", JSON.stringify(gemte));
  }

  visGemteBoliger();
  alert("✅ Boligen er gemt!");
}

function visGemteBoliger() {
  const gemte = JSON.parse(
    localStorage.getItem("gemteBoliger") || "[]"
  );

  const container = document.getElementById("gemteBoliger");
  container.replaceChildren();

  if (gemte.length === 0) {
    container.textContent = "Du har ingen gemte boliger endnu.";
    return;
  }

  gemte.forEach((opslag) => {
    const kort = document.createElement("div");
    kort.style.background = "white";
    kort.style.padding = "15px";
    kort.style.marginBottom = "10px";
    kort.style.borderRadius = "10px";
    kort.style.whiteSpace = "pre-wrap";
    kort.textContent = opslag;
    container.appendChild(kort);
  });
}

document.addEventListener("DOMContentLoaded", visGemteBoliger);

let senesteKommentar = "";


function laesBeloeb(tekst) {
  if (!tekst) return null;

  const match = tekst.match(
    /(\d+(?:[.,]\d+)*)(?:\s*(mio\.?|million(?:er)?|kr\.?))?/i
  );

  if (!match) return null;

  const tal = match[1];
  const enhed = match[2] || "";

  if (/mio|million/i.test(enhed)) {
    return Math.round(
      Number(tal.replace(",", ".")) * 1000000
    );
  }

  if (/^\d{1,3}(?:\.\d{3})+$/.test(tal)) {
    return Number(tal.replace(/\./g, ""));
  }

  return Number(tal.replace(",", "."));
}


function findBeloeb(tekst, felter) {
  for (const felt of felter) {
    const match = tekst.match(
      new RegExp(
        felt + "\\s*(?:er|på|:)?\\s*" +
        "([\\d.,]+\\s*(?:mio\\.?|millioner?|kr\\.?)?)",
        "i"
      )
    );

    if (match) return laesBeloeb(match[1]);
  }

  return null;
}

function tjekOpslag() {
  const tekst = document.getElementById("opslag").value;
  const resultat = document.getElementById("resultat");
  const knap = document.getElementById("kopierKnap");

  senesteKommentar = "";
  knap.hidden = true;
  senesteOpslag = "";
document.getElementById("gemKnap").hidden = true;

  if (!tekst.trim()) {
    resultat.textContent = "Indsæt et opslag først.";
    return;
  }

  const erAndel = /andelsbolig|andelslejlighed|andel\b/i.test(tekst);
  const erLeje = /lejebolig|udlejes|til leje|husleje/i.test(tekst);

  const rumMatch = tekst.match(
    /(\d+)\s*[- ]?\s*(?:værelses|værelser|vær\.?)/i
  );

  const vaerelser = rumMatch ? Number(rumMatch[1]) : null;

  const pris = findBeloeb(tekst, [
    "pris", "salgspris", "andelspris", "til"
  ]);

  
const boligydelse = findBeloeb(tekst, [
  "boligydelse",
  "boligydelsen",
  "boligafgift",
  "boligafgiften",
  "månedlig ydelse",
  "månedlig boligafgift"
]);


  const husleje = findBeloeb(tekst, [
    "husleje", "leje", "månedlig leje"
  ]);

  const mangler = [];
  const problemer = [];

  if (!erAndel && !erLeje) {
    mangler.push("Boligtype");
  }

  if (vaerelser === null) {
    mangler.push("Antal værelser");
  } else if (vaerelser < 2) {
    problemer.push("Færre end 2 værelser");
  }

  if (erAndel) {
    if (pris === null) {
      mangler.push("Købspris");
    } else if (pris > 1700000) {
      problemer.push("Købspris over 1.700.000 kr.");
    }

    if (boligydelse === null) {
      mangler.push("Boligydelse");
    } else if (boligydelse > 6000) {
      problemer.push("Boligydelse over 6.000 kr.");
    }
  } else if (erLeje) {
    if (husleje === null) {
      mangler.push("Husleje");
    } else if (husleje > 9000) {
      problemer.push("Husleje over 9.000 kr.");
    }
  }

  let status = "";

  if (problemer.length) {
    status = "❌ PASSER IKKE";
  } else if (mangler.length) {
    status = "🟡 MANGLER OPLYSNINGER";
  } else {
    status = "✅ FORELØBIGT MATCH";
  }

  let besked = status + "\n\n";

  besked += "Boligtype: " +
    (erAndel ? "Andel" : erLeje ? "Leje" : "Ukendt") + "\n";

  besked += "Værelser: " + (vaerelser ?? "Ukendt") + "\n";

  if (erAndel) {
    besked += "Pris: " +
      (pris === null ? "Ukendt" : pris.toLocaleString("da-DK") + " kr.") + "\n";
    besked += "Boligydelse: " +
      (boligydelse === null ? "Ukendt" : boligydelse.toLocaleString("da-DK") + " kr.") + "\n";
  } else if (erLeje) {
    besked += "Husleje: " +
      (husleje === null ? "Ukendt" : husleje.toLocaleString("da-DK") + " kr.") + "\n";
  }

  if (mangler.length) {
    besked += "\nMangler: " + mangler.join(", ") + "\n";
  }

  if (problemer.length) {
    besked += "\nProblemer: " + problemer.join(", ") + "\n";
  }

  if (!problemer.length && (erAndel || erLeje)) {
    senesteOpslag = tekst;
document.getElementById("gemKnap").hidden = false;

    const boligtype = erAndel ? "andelsboligen" : "lejligheden";

    senesteKommentar =
      `Hej! Vi er et par, der er meget interesserede i ${boligtype}. ` +
      "Vi søger et hjem i Storkøbenhavn. " +
      (erAndel
        ? "Vi er allerede bankgodkendte og klar til at gå videre med en handel. "
        : "") +
      "Vi vil meget gerne høre mere og komme til en fremvisning. 😊";

    besked += "\n💬 Kommentarudkast:\n" + senesteKommentar;
    knap.hidden = false;
  }

  besked += "\n\n📍 Husk at kontrollere området manuelt.";

  resultat.textContent = besked;
}

async function kopierKommentar() {
  if (!senesteKommentar) return;

  try {
    await navigator.clipboard.writeText(senesteKommentar);
    alert("✅ Kommentaren er kopieret!");
  } catch {
    alert("Kunne ikke kopiere kommentaren.");
  }
}
</script>
</body>
</html>
